# Phase 1 evaluation set — 10 English + 10 French requests.
# "today" is fixed so date expectations never change.
# Only the fields listed under "expect" are checked. Matching rules:
#   scalars / dates      exact match (dates as YYYY-MM-DD, or null)
#   destinations         every expected name appears in the parsed list (accents/case ignored)
#   origin_airports      same set of codes
#   preferences_contains every keyword appears somewhere in the parsed preferences
#   missing              same set as SearchRequest.missing_fields()
# Pass mark for Phase 1: 18 / 20.

today: "2026-09-29"
home_location: "Bromont, QC"

cases:
  # ---------------------------------------------------------------- English
  - id: en01
    text: "Adults-only 4.5 star all-inclusive, direct flight, 7 nights sometime in February, under $3,000 for two"
    expect:
      adults: 2
      adults_only_resort: true
      trip_type: all_inclusive
      min_stars: 4.5
      direct_flight_only: true
      depart_earliest: "2027-02-01"
      depart_latest: "2027-02-28"
      nights_min: 7
      nights_max: 7
      max_budget_total_cad: 3000
      language: en

  - id: en02
    text: "Cheapest flight only from Burlington or Boston to Dallas, leaving March 12 2027, coming back March 19"
    expect:
      trip_type: flight_only
      origin_airports: [BTV, BOS]
      destinations: [Dallas]
      depart_earliest: "2027-03-12"
      depart_latest: "2027-03-12"
      nights_min: 7
      nights_max: 7

  - id: en03
    text: "Family of 4, kids aged 6 and 9, all inclusive in Punta Cana, about a week in the first two weeks of March, max $6000 total"
    expect:
      adults: 2
      children_ages: [6, 9]
      trip_type: all_inclusive
      destinations: [Punta Cana]
      depart_earliest: "2027-03-01"
      depart_latest: "2027-03-14"
      nights_min: 6
      nights_max: 8
      max_budget_total_cad: 6000

  - id: en04
