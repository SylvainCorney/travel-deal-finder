      depart_latest: "2027-01-15"
      nights_min: 4
      nights_max: 4

  - id: en05
    text: "My wife and I want a quiet all-inclusive resort with a nice beach in Mexico, 10 to 14 nights in January, 4 stars minimum"
    expect:
      adults: 2
      trip_type: all_inclusive
      destinations: [Mexico]
